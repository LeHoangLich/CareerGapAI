services:
  db:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: careergap
      POSTGRES_USER: careergap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - careergap_pg16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careergap -d careergap"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  careergap_pg16:
